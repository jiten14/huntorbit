name: Scheduled Pages Rebuild

# Jekyll excludes future-dated posts by default, and GitHub Pages only
# rebuilds on a push. This workflow runs daily and calls GitHub's Pages
# build API directly (no commit needed), so any post whose date has now
# arrived gets published automatically without manual intervention.

on:
  schedule:
    - cron: '5 0 * * *'  # 00:05 UTC daily
  workflow_dispatch: {}   # allows manually triggering a rebuild anytime from the Actions tab

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger GitHub Pages build
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds
