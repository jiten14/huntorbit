<header class="site-header">
  <div class="wrap header-inner">
    <a href="{{ '/' | relative_url }}" class="logo" aria-label="HuntOrbit home">
      <svg width="34" height="34" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="21" fill="none" stroke="#1F2D50" stroke-width="2.5"/>
        <polygon points="31.8,16.2 26.8,26.8 16.2,31.8" fill="#1F2D50"/>
        <polygon points="31.8,16.2 16.2,31.8 21.2,21.2" fill="#1F2D50" opacity="0.4"/>
        <circle cx="24" cy="24" r="2.2" fill="#FAF9F6"/>
      </svg>
      <span class="logo-word">Hunt<span>Orbit</span></span>
    </a>

    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <nav class="main-nav">
      <a href="{{ '/' | relative_url }}">Home</a>

      <div class="nav-item has-dropdown">
        <button class="nav-item-btn" aria-expanded="false">Category
          <span class="caret"></span>
        </button>
        <div class="dropdown">
          <div class="dropdown-label">Browse by category</div>
          <div class="cat-grid">
            {% assign grouped = site.posts | group_by: "category" %}
            {% for cat in grouped %}
              <a class="cat-item" href="{{ '/category/' | append: cat.name | append: '/' | relative_url }}">
                {{ site.data.categories[cat.name] | default: cat.name }}
                <span class="cat-count">{{ cat.items.size }}</span>
              </a>
            {% endfor %}
          </div>
        </div>
      </div>

      <a href="{{ '/write-for-us/' | relative_url }}">Write for us</a>
    </nav>
  </div>
</header>
