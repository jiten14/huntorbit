---
layout: default
---
<div class="page-wrap">
  <div class="page-header">
    {% if page.label %}<div class="page-label">{{ page.label }}</div>{% endif %}
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.intro %}<p class="page-intro">{{ page.intro }}</p>{% endif %}
  </div>

  <div class="prose">
    {{ content }}
  </div>

  {% if page.cta_title %}
  <div class="cta-box">
    <div class="cta-text">
      <h3>{{ page.cta_title }}</h3>
      <p>{{ page.cta_text }}</p>
    </div>
    <a class="cta-btn" href="{{ page.cta_url }}" target="_blank" rel="noopener">{{ page.cta_label }} &rarr;</a>
  </div>
  {% endif %}
</div>
