---
layout: default
---
<div class="wrap">
  <div class="page-header" style="padding-top:40px;">
    <div class="page-label">Category</div>
    <h1 class="page-title">{{ page.title }}</h1>
  </div>

  {% assign filtered = site.posts | where: "category", page.category_filter %}
  <div class="grid" style="margin-top:28px;">
    {% for post in filtered %}
      {% include card.html post=post %}
    {% endfor %}
  </div>

  {% if filtered.size == 0 %}
  <p class="prose" style="margin-top:20px;">No reviews in this category yet — check back soon.</p>
  {% endif %}
</div>
